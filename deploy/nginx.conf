# nginx server block for osamajenana.com
#
# Install as /etc/nginx/sites-available/osamajenana.com and symlink into
# sites-enabled. Run certbot BEFORE enabling the TLS blocks below — see
# deploy/README.md for the order.
#
# ---------------------------------------------------------------------------
# THIS BOX RUNS OTHER SITES. Everything here is scoped so it cannot touch them:
#
#   * Every server block matches by `server_name` only. None is marked
#     `default_server`, so nothing here intercepts another project's traffic.
#   * The upstream is named `portfolio_app`, not something generic that could
#     collide with an upstream another config already defines.
#   * No `http {}`-level settings: gzip, timeouts and buffers are set inside the
#     server block, so they apply to this site and no other.
#   * Nothing here disables or replaces the default site. Do not run
#     `rm /etc/nginx/sites-enabled/default` — on a shared box that is somebody
#     else's config.
# ---------------------------------------------------------------------------

# The only place the app's port is written. Change it here if 3100 is taken and
# keep ecosystem.config.cjs in step — deploy.sh reads the port from that file.
upstream portfolio_app {
    server 127.0.0.1:3100;
    keepalive 16;
}

# --- redirect http to https --------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name osamajenana.com www.osamajenana.com;

    # Leave this reachable over http so certbot can renew.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://osamajenana.com$request_uri;
    }
}

# --- redirect www to the bare domain ----------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.osamajenana.com;

    ssl_certificate     /etc/letsencrypt/live/osamajenana.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/osamajenana.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://osamajenana.com$request_uri;
}

# --- the site ----------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name osamajenana.com;

    ssl_certificate     /etc/letsencrypt/live/osamajenana.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/osamajenana.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ---- security headers ----
    # HSTS: only enable the preload directive once you are certain you will not
    # need to serve this domain over plain http again. It is hard to undo.
    #
    # includeSubDomains applies to subdomains of THIS domain only, so it cannot
    # reach another project unless that project lives under osamajenana.com.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), browsing-topics=()" always;

    # Content Security Policy.
    #
    # `script-src 'unsafe-inline'` is a considered concession, not an oversight.
    # Every page here is statically generated, and both Next's hydration
    # bootstrap and the theme script in the layout are inline. A nonce would
    # remove the need for it, but a nonce is per-request, which forces every page
    # to render dynamically — trading the site's static delivery and its LCP for
    # a marginal gain against an attack that first requires an HTML injection
    # this site has no vector for.
    #
    # Everything that actually limits blast radius is locked down: no external
    # script origins, no framing, no plugins, and form submissions can only go
    # back to this origin.
    #
    # If you add self-hosted Umami or a Cal.com embed, append their origin to
    # script-src and connect-src (frame-src too, for Cal.com).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;

    # ---- compression ----
    # Scoped to this server block on purpose; setting it at http level would
    # change behaviour for every other site on the box.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml application/xml application/xml+rss
        application/javascript application/json application/manifest+json
        image/svg+xml application/rss+xml;

    # Uncomment if libnginx-mod-brotli is installed — better than gzip and worth
    # it. Check with `nginx -V 2>&1 | grep -o brotli` before enabling; a missing
    # module makes nginx refuse to start, which would take the other sites down
    # with it.
    # brotli on;
    # brotli_comp_level 5;
    # brotli_types text/plain text/css application/javascript application/json image/svg+xml;

    # Do not advertise the exact nginx build.
    server_tokens off;

    # The portrait crops and the CV PDF are the largest things served.
    client_max_body_size 4m;

    # ---- caching ----
    # Hashed build output never changes under the same name.
    location /_next/static/ {
        proxy_pass http://portfolio_app;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # Screenshots, portrait crops and icons: the size is in the filename, so a
    # changed image is a changed URL and these are safe to pin for a year.
    location ~* ^/(work|me|fonts)/.*\.(avif|webp|png|jpg|woff2)$ {
        proxy_pass http://portfolio_app;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # The CV is a real file that gets replaced in place when it is revised, so it
    # revalidates hourly rather than being pinned. A year-old CV sitting in
    # somebody's cache is the one failure this must not have.
    location /cv/ {
        proxy_pass http://portfolio_app;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        include /etc/nginx/proxy_params;
    }

    # ---- everything else ----
    location / {
        proxy_pass http://portfolio_app;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # The contact form's rate limiter reads the left-most entry of this
        # header. Without it every visitor shares one bucket.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # HTML must not be cached by intermediaries — content changes on redeploy.
    location = / {
        proxy_pass http://portfolio_app;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        include /etc/nginx/proxy_params;
    }
}
