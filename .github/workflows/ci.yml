name: CI

on:
  push:
    branches: [main, v2-nextjs]
  pull_request:
  workflow_dispatch:

# A newer push supersedes an in-flight run on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Node 22 LTS, matching the VPS. The local machine runs a newer, non-LTS
  # Node; CI is the version that has to agree with production.
  NODE_VERSION: '22'

jobs:
  static:
    name: Types, lint, formatting, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npm run format:check

      - name: Unit tests
        # Content schemas, i18n key parity, and the WCAG contrast ratios read
        # straight out of globals.css.
        run: npm run test:unit

      - name: Audit production dependencies
        # Dev-only advisories are excluded deliberately: they never reach the
        # server, and chasing them once broke the linter.
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: End-to-end and accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install chromium --with-deps

      - name: Build
        run: npm run build

      - name: Playwright
        # Desktop and mobile projects: axe on every route in both locales, plus
        # keyboard access, RTL, the scene's pause behaviour and the contact form.
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    name: Performance budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Build
        env:
          # Same origin the audit runs against, so rel=canonical is same-origin
          # and the SEO category measures the real code path.
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3211
        run: npm run build

      - name: Lighthouse CI
        env:
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3211
        # Budgets live in lighthouserc.json: performance >= 95, accessibility,
        # best-practices and SEO at 100, LCP <= 2s, CLS <= 0.02, TBT <= 200ms.
        run: npm run lighthouse

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 7
